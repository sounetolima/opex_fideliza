[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Painel de licenças servido pelo mesmo endereço do site (o serviço de licenças continua no projeto opex-care-licencas)
[[redirects]]
  from = "/admin"
  to = "https://opex-care-licencas.netlify.app/admin/"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://opex-care-licencas.netlify.app/admin/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://opex-care-licencas.netlify.app/api/:splat"
  status = 200
  force = true
